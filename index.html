<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yayo VOD Suggestions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f0ec;--fg:#191817;--muted:#5a5650;--line:#d4d0c8;--surface:#fff;--accent:#a3231a}
@media (prefers-color-scheme:dark){:root{--bg:#141312;--fg:#f0eee9;--muted:#a09a90;--line:#2f2c29;--surface:#1c1a19;--accent:#e0553f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.55 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:54rem;margin-inline:auto;padding:clamp(2rem,7vw,5rem) max(16px,env(safe-area-inset-left,0px))}
h1{font:800 clamp(2.6rem,9vw,5rem)/.95 Fraunces,Georgia,serif;margin:0 0 1rem;text-wrap:balance}
.lead{max-width:34rem;color:var(--muted);margin:0 0 2.5rem;font-size:1.1rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
a.card{display:grid;gap:.25rem;padding:1.25rem 1.4rem;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--fg)}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.t{font:600 1.35rem/1.2 Fraunces,Georgia,serif}
.d{color:var(--muted)}
.n{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Yayo VOD Suggestions</h1>
  <p class="lead">Hand-picked movie lists, each ranked and graded. Open a list to filter and search it.</p>
  <ul>
    <li><a class="card" href="war/"><span class="n">List 01</span><span class="t">War films, most reliable first</span><span class="d">21 war movies graded on how closely they follow what really happened.</span></a></li>
  </ul>
</div>
</body>
</html>
