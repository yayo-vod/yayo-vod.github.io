<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War Films Ranked</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos%20Stencil:wght@400;700&family=IBM%20Plex%20Sans:wght@400;500;600&family=Courier%20Prime:wght@400;700&display=swap">
<style>
body{margin:0}
:root{
  --bg: #d3d0b0;
  --surface: #e8e5cd;
  --paper-dark: #dcd8bb;
  --fg: #1d2415;
  --muted: #4a503a;
  --line: #aba884;
  --topo-ink: #b7b490;
  --accent: #a3231a;
  --accent-text: #8f1d15;
  --display: "Stardos Stencil", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg: #12170e;
  --surface: #1d2417;
  --paper-dark: #252d1e;
  --fg: #e4e6d3;
  --muted: #a4ab8e;
  --line: #343d29;
  --topo-ink: #232c1b;
  --accent: #e0553f;
  --accent-text: #f0735c;
  color-scheme: dark}}
:root[data-theme="dark"]{
  --bg: #12170e;
  --surface: #1d2417;
  --paper-dark: #252d1e;
  --fg: #e4e6d3;
  --muted: #a4ab8e;
  --line: #343d29;
  --topo-ink: #232c1b;
  --accent: #e0553f;
  --accent-text: #f0735c;
  color-scheme: dark}
/* structure */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased;position:relative}
.wrap{position:relative;z-index:1;max-width:62rem;margin-inline:auto;padding-block:clamp(1.25rem,4vw,3rem);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{list-style:none;padding:0}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{cursor:pointer;color:inherit;min-height:2.5rem}
.search{display:grid;gap:.35rem}
.search input{font:inherit;width:100%;max-width:26rem;color:var(--fg)}
.segs{display:flex;gap:3px}
.segs i{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--topo-ink);-webkit-mask:var(--topo) center/520px;mask:var(--topo) center/520px;opacity:.55}
.head{position:relative;display:grid;gap:1rem;padding:clamp(1.25rem,4vw,2.25rem);background:var(--surface);border:2px solid var(--fg);box-shadow:6px 6px 0 var(--fg)}
.head::before,.head::after{content:"";position:absolute;width:1.2rem;height:1.2rem;border:solid var(--accent);pointer-events:none}
.head::before{top:-.7rem;left:-.7rem;border-width:3px 0 0 3px}
.head::after{bottom:-.7rem;right:-.7rem;border-width:0 3px 3px 0}
.eyebrow{font:700 .8rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text);display:flex;align-items:center;gap:.75rem}
.eyebrow::before{content:"";width:2.2rem;height:3px;background:var(--accent)}
h1{font:400 clamp(2.9rem,11vw,6.6rem)/.88 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.lead{max-width:40rem;color:var(--muted);font-size:1.0625rem}
.stats{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;font:700 .8rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:.9rem;border-top:2px dashed var(--line)}
.stats b{color:var(--fg)}
.controls{margin-top:1.5rem;display:grid;gap:.8rem;padding:1rem 0;background:linear-gradient(var(--bg) 85%,transparent)}
.chip{font:700 .78rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:.6rem .8rem;background:var(--surface);border:2px solid var(--fg);border-radius:0;box-shadow:3px 3px 0 var(--fg)}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none;transform:translate(3px,3px)}
.search label{font:700 .72rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.search input{background:var(--surface);border:2px solid var(--fg);border-radius:0;padding:.7rem .85rem}
.search input::placeholder{color:var(--muted)}
.tier{margin-top:clamp(1.75rem,5vw,3rem)}
.tier h2{display:grid;grid-template-columns:auto 1fr;gap:.1rem 1rem;align-items:center}
.tier h2 .g{grid-row:span 2;display:grid;place-items:center;width:3.4rem;height:3.4rem;background:var(--fg);color:var(--bg);font:400 2.4rem/1 var(--display)}
.tier h2 .tn{font:400 clamp(1.4rem,4vw,2rem)/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.tier h2 small{font:400 .92rem/1.35 var(--body);color:var(--muted)}
.tier ol{margin-top:1rem;display:grid;gap:.9rem}
.film{display:grid;grid-template-columns:4.2rem minmax(0,1fr);background:var(--surface);border:2px solid var(--fg);box-shadow:5px 5px 0 var(--line);position:relative}
.tab{display:grid;align-content:center;justify-items:center;gap:.15rem;border-right:2px dashed var(--fg);padding:.6rem .2rem;background:var(--paper-dark)}
.tab span{font:700 .6rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tab b{font:400 1.9rem/1 var(--display);font-variant-numeric:tabular-nums}
.main{padding:.9rem 1rem;display:grid;gap:.3rem;align-content:center;min-width:0}
.name{font:400 1.55rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em}
.name span{font:700 .8rem/1 var(--mono);color:var(--muted);margin-left:.7rem;letter-spacing:.05em}
.name span::before{content:"// "}
.note{color:var(--muted);max-width:36rem}
.stamp{grid-column:1/-1;display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;border-top:2px dashed var(--fg);font:700 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text)}
.stamp b{font:400 1.5rem/1 var(--display);border:3px solid currentColor;padding:.1rem .5rem;transform:rotate(-5deg);letter-spacing:0}
.stamp .segs{margin-left:auto}
.segs i{width:1rem;height:.6rem;background:var(--line);border:1px solid var(--fg)}
.segs i.on{background:var(--accent);border-color:var(--accent)}
.t3 .stamp,.t4 .stamp{color:var(--muted)}
.t3 .segs i.on,.t4 .segs i.on{background:var(--muted);border-color:var(--muted)}
.empty{padding:2rem 0;color:var(--muted);font:700 .85rem/1.4 var(--mono)}
.foot{margin-top:3rem;padding-top:1rem;border-top:2px dashed var(--fg);color:var(--muted);font-size:.9rem;max-width:44rem}
@media (min-width:46rem){
  .film{grid-template-columns:5rem minmax(0,1fr) 12.5rem}
  .stamp{grid-column:auto;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;border-top:0;border-left:2px dashed var(--fg);padding:.9rem .6rem;text-align:center}
  .stamp .segs{margin-left:0}
  .stamp b{font-size:2.2rem}
  .name{font-size:1.8rem}
}
@media (prefers-reduced-motion:no-preference){
  .chip{transition:transform .1s,box-shadow .1s,background .15s}
  .stamp b{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes stamp{from{transform:rotate(-5deg) scale(1.35);opacity:.2}to{transform:rotate(-5deg) scale(1);opacity:1}}
}

</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">&larr; All lists</a>
  <header class="head">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <ul class="stats" id="stats"></ul>
  </header>
  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Filter by grade"></div>
    <div class="search"><label for="q">Search title</label><input id="q" type="search" placeholder="Type a title" autocomplete="off"></div>
  </div>
  <main id="list" aria-live="polite"></main>
  <footer class="foot" id="foot"></footer>
</div>
<script>
const L = {"eyebrow": "Accuracy audit", "heading": "War films, most reliable first", "lead": "21 war movies graded on how closely they follow what really happened. Grade A films follow the record. Grade E films only borrow a war as scenery.", "meterName": "Reliability grade", "slots": 5, "footer": "Grades borrow their letters from the way intelligence services rate sources: A is most reliable. The ranking is a judgment from general knowledge of the films and the events, not a scholarly ranking. Expect to disagree about the middle.", "tiers": [{"name": "True story", "blurb": "Real people and events, told close to the record.", "short": "True story", "fill": 5, "grade": "A"}, {"name": "Real setting, invented story", "blurb": "A real battle or war, with fictional characters.", "short": "Real setting", "fill": 4, "grade": "B"}, {"name": "Fiction with a real backdrop", "blurb": "Invented plot that touches real history.", "short": "Fiction, real backdrop", "fill": 3, "grade": "C"}, {"name": "Alternate history", "blurb": "Rewrites what actually happened, on purpose.", "short": "Alternate history", "fill": 2, "grade": "D"}, {"name": "Fantasy, horror, sci-fi", "blurb": "A war used as scenery for something impossible.", "short": "Not historical", "fill": 1, "grade": "E"}], "films": [{"title": "Valkyrie", "year": 2008, "tier": 0, "note": "The 1944 plot to kill Hitler. People and events follow the record closely."}, {"title": "Irena's Vow", "year": 2023, "tier": 0, "note": "Irena Gut Opdyke hides Jews in a German officer's villa. Adapted from her memoir."}, {"title": "Glory", "year": 1989, "tier": 0, "note": "The 54th Massachusetts, one of the first Black regiments. Some recruits are composites."}, {"title": "Charlie Wilson's War", "year": 2007, "tier": 0, "note": "US funding of Afghan fighters in the 1980s. Events are compressed and the aftermath is left out."}, {"title": "The Imitation Game", "year": 2014, "tier": 0, "note": "Real Bletchley Park codebreaking, but Turing's role and several relationships are reworked."}, {"title": "The Forgotten Battle", "year": 2020, "tier": 1, "note": "The 1944 Battle of the Scheldt. The three leads are fictional."}, {"title": "Saving Private Ryan", "year": 1998, "tier": 1, "note": "The D-Day landing is recreated very accurately. The rescue mission never happened."}, {"title": "Fury", "year": 2014, "tier": 1, "note": "Germany, 1945. Tanks and tactics are faithful, the crew and story are invented."}, {"title": "Greyhound", "year": 2020, "tier": 1, "note": "An Atlantic convoy escort hunted by U-boats. From a novel, with accurate tactics."}, {"title": "1917", "year": 2019, "tier": 1, "note": "The German withdrawal of 1917. The two-soldier mission is fictional, loosely from a family story."}, {"title": "War Machine", "year": 2017, "tier": 2, "note": "A satire of the US command in Afghanistan. Names changed, events fictionalized."}, {"title": "Legends of the Fall", "year": 1994, "tier": 2, "note": "A family saga that touches the First World War. No real event drives the plot."}, {"title": "Allied", "year": 2016, "tier": 2, "note": "A fictional spy romance set in 1942 Casablanca."}, {"title": "Forrest Gump", "year": 1994, "tier": 2, "note": "A fictional man placed beside Vietnam and other real events."}, {"title": "Inglourious Basterds", "year": 2009, "tier": 3, "note": "Deliberately rewrites the Second World War. Hitler does not die this way."}, {"title": "Overlord", "year": 2018, "tier": 4, "note": "Set on the eve of D-Day, but the plot is a zombie experiment."}, {"title": "Ghosts of War", "year": 2020, "tier": 4, "note": "A haunted-house story with soldiers. No real events."}, {"title": "The Lair", "year": 2022, "tier": 4, "note": "Afghanistan setting with an invented creature."}, {"title": "Trench 11", "year": null, "tier": 4, "note": "A fictional bunker experiment in a First World War trench."}, {"title": "Edge of Tomorrow", "year": 2014, "tier": 4, "note": "Alien invasion and a time loop. A Normandy-style beach is the only echo."}, {"title": "The Tomorrow War", "year": 2021, "tier": 4, "note": "Soldiers sent forward in time to fight aliens."}], "rankWord": "File", "unit": "films"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('eyebrow').textContent = L.eyebrow;
$('h1').textContent = L.heading;
$('lead').textContent = L.lead;
$('foot').textContent = L.footer;
const films = L.films.map((f, i) => ({...f, rank: i + 1}));
$('stats').innerHTML = `<li><b>${films.length}</b> ${esc(L.unit)}</li><li><b>${L.tiers.length}</b> grades</li><li>${esc(L.meterName)}</li>`;
let tier = 'all', q = '';
function chip(label, val, title){
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = label; b.dataset.v = val;
  if (title) b.title = title;
  b.setAttribute('aria-pressed', String(val === tier));
  b.onclick = () => { tier = val; [...$('chips').children].forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === String(tier)))); render(); };
  $('chips').append(b);
}
chip('All', 'all');
L.tiers.forEach((t, i) => chip(`${t.grade} · ${t.short}`, i, t.name));
function render(){
  const out = [];
  L.tiers.forEach((t, ti) => {
    if (tier !== 'all' && tier !== ti) return;
    const rows = films.filter(f => f.tier === ti && f.title.toLowerCase().includes(q));
    if (!rows.length) return;
    const segs = Array.from({length: L.slots}, (_, k) => `<i class="${k < t.fill ? 'on' : ''}"></i>`).join('');
    out.push(`<section class="tier t${ti}" aria-labelledby="t${ti}"><h2 id="t${ti}"><span class="g">${esc(t.grade)}</span><span class="tn">${esc(t.name)}</span><small>${esc(t.blurb)}</small></h2><ol>` +
      rows.map(f => `<li class="film"><div class="tab" aria-label="${esc(L.rankWord)} ${f.rank}"><span>${esc(L.rankWord)}</span><b>${String(f.rank).padStart(2,'0')}</b></div>
        <div class="main"><h3 class="name">${esc(f.title)}${f.year ? `<span>${f.year}</span>` : ''}</h3><p class="note">${esc(f.note)}</p></div>
        <div class="stamp" role="img" aria-label="${esc(L.meterName)}: grade ${esc(t.grade)}, ${esc(t.name)}"><b>${esc(t.grade)}</b><span>${esc(t.short)}</span><span class="segs">${segs}</span></div></li>`).join('') +
      `</ol></section>`);
  });
  $('list').innerHTML = out.join('') || `<p class="empty">Nothing matches. Clear the search or pick another grade.</p>`;
}
$('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
render();
</script>
</body>
</html>
